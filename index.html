<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A local prototype for extracting simple metadata from an article URL.">
  <title>Insight Dashboard Prototype</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <p class="eyebrow">Information display prototype</p>
    <h1>Insight dashboard</h1>
    <p class="intro">Enter an article URL to inspect its host, path terms and estimated reading length.</p>
    <form id="analysis-form">
      <label for="url-input">Article URL</label>
      <div class="form-row">
        <input id="url-input" type="url" placeholder="https://example.com/article" required>
        <button type="submit">Inspect</button>
      </div>
    </form>
    <p id="message" class="message" role="status" aria-live="polite"></p>
    <section id="results" class="results" aria-label="Analysis results"></section>
  </main>
</body>
</html>
